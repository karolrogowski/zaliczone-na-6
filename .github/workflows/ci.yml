name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Zainstaluj zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sprawdzenie typów TypeScript
        run: npx tsc --noEmit

      - name: Build produkcyjny
        run: npm run build

      - name: Audyt bezpieczeństwa
        run: npm audit --audit-level=high

      - name: Testy jednostkowe (Vitest)
        run: npm run test:run

      - name: Zainstaluj Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Cache obrazów Docker (Supabase)
        id: supabase-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-docker.tar
          key: supabase-docker-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Wczytaj obrazy Docker z cache
        if: steps.supabase-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-docker.tar

      - name: Uruchom lokalnego Supabase
        run: supabase start

      - name: Zapisz obrazy Docker do cache
        if: steps.supabase-cache.outputs.cache-hit != 'true'
        run: |
          docker save \
            $(docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E 'supabase|postgrest|deno|inbucket' \
              | grep -v '<none>') \
            -o /tmp/supabase-docker.tar

      - name: Utwórz .env.local z kluczami Supabase
        run: |
          STATUS=$(supabase status --output env)
          API_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2-)
          ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2-)
          SERVICE_ROLE=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE"
            echo "WHEREBY_API_KEY=${{ secrets.WHEREBY_API_KEY }}"
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}"
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
            echo "ADMIN_FULL_NAME=${{ secrets.ADMIN_FULL_NAME }}"
            echo "COMMISSION_RATE=0.20"
            echo "PRICE_30_MIN_GROSZE=5000"
            echo "PRICE_60_MIN_GROSZE=9000"
          } > .env.local

      - name: Zainstaluj Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Testy E2E (Playwright)
        run: npm run test:e2e

      - name: Wgraj raport testów przy niepowodzeniu
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7