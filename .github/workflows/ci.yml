name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Zainstaluj zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sprawdzenie typów TypeScript
        run: npx tsc --noEmit

      - name: Build produkcyjny
        run: npm run build

      - name: Audyt bezpieczeństwa
        run: npm audit --audit-level=high

      - name: Testy jednostkowe (Vitest)
        run: npm run test:run

      - name: Cache obrazów Docker (Supabase)
        id: supabase-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-docker.tar
          key: supabase-docker-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Wczytaj obrazy Docker z cache
        if: steps.supabase-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-docker.tar

      - name: Uruchom lokalnego Supabase
        run: npx supabase start

      - name: Zapisz obrazy Docker do cache
        if: steps.supabase-cache.outputs.cache-hit != 'true'
        run: |
          docker save \
            $(docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -E 'supabase|postgrest|deno|inbucket' \
              | grep -v '<none>') \
            -o /tmp/supabase-docker.tar

      - name: Utwórz .env.local z kluczami lokalnego Supabase
        run: |
          STATUS=$(npx supabase status --output env)
          echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2-)"        > .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2-)"  >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)" >> .env.local

      - name: Cache przeglądarek Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Zainstaluj Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Testy E2E (Playwright) — lokalny Supabase
        run: npm run test:e2e

      - name: Wgraj raport testów przy niepowodzeniu
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Smoke testy na Vercel preview — weryfikacja że deployment działa z prawdziwym Supabase,
  # ZANIM zmiany trafią na produkcję. Blokuje merge jeśli env vars w Vercel są błędne.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Wymaga: VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_BYPASS_SECRET, SMOKE_TEST_EMAIL, SMOKE_TEST_PASSWORD
    # SMOKE_TEST_EMAIL / SMOKE_TEST_PASSWORD to dane użytkownika istniejącego w chmurowym Supabase.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Zainstaluj zależności
        run: npm ci

      - name: Cache przeglądarek Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Zainstaluj Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Czekaj na Vercel preview i uruchom smoke testy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Szukam preview deploymentu dla commita $COMMIT_SHA..."

          for i in $(seq 1 20); do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=10")

            RESULT=$(echo "$RESPONSE" | \
              python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          sha = '$COMMIT_SHA'
          for d in data.get('deployments', []):
              meta = d.get('meta', {})
              if meta.get('githubCommitSha', '').startswith(sha[:12]):
                  print(d.get('readyState', 'UNKNOWN') + ' ' + d.get('url', ''))
                  break
          else:
              print('NOT_FOUND')
          ")

            STATE=$(echo "$RESULT" | cut -d' ' -f1)
            URL=$(echo "$RESULT" | cut -d' ' -f2)

            echo "Próba $i/20 — stan: $STATE"

            if [ "$STATE" = "READY" ]; then
              echo "✅ Preview gotowy: https://$URL"
              export PLAYWRIGHT_BASE_URL="https://$URL"
              npx playwright test --config=playwright.smoke.config.ts
              exit $?
            elif [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ Preview deployment zakończony błędem: $STATE"
              exit 1
            fi

            sleep 30
          done

          echo "❌ Timeout — preview deployment nie zakończył się w ciągu 10 minut"
          exit 1

      - name: Wgraj raport smoke testów przy niepowodzeniu
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7
