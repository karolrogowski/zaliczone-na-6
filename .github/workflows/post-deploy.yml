name: Weryfikacja wdrożenia

on:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Zastosuj migracje do Supabase Cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --yes
          npx supabase db push --yes

      - name: Ustaw rate limity auth przez Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "=== Aktualna konfiguracja auth (przed zmianą) ==="
          curl -sf \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -m json.tool | grep -i "rate_limit"

          curl -sf -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "rate_limit_email_sent": 2,
              "rate_limit_token_refresh": 150,
              "rate_limit_verify": 30,
              "rate_limit_anonymous_users": 30
            }'

  health:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Czekaj na deployment Vercel
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Szukam deploymentu dla commita $COMMIT_SHA..."

          for i in $(seq 1 20); do
            RESPONSE=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=10")

            RESULT=$(echo "$RESPONSE" | \
              python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          sha = '$COMMIT_SHA'
          for d in data.get('deployments', []):
              meta = d.get('meta', {})
              if meta.get('githubCommitSha', '').startswith(sha[:12]):
                  print(d.get('readyState', 'UNKNOWN') + ' ' + d.get('url', ''))
                  break
          else:
              print('NOT_FOUND')
          ")

            STATE=$(echo "$RESULT" | cut -d' ' -f1)
            URL=$(echo "$RESULT" | cut -d' ' -f2)

            echo "Próba $i/20 — stan: $STATE"

            if [ "$STATE" = "READY" ]; then
              echo "url=https://$URL" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ Deployment zakończony błędem: $STATE"
              exit 1
            fi

            sleep 30
          done

          echo "❌ Timeout — deployment nie zakończył się w ciągu 10 minut"
          exit 1

      - name: Health check — Supabase connectivity i podstawowe trasy
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          check() {
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" "$1")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $1 → $STATUS"
            else
              echo "❌ $1 → $STATUS"
              exit 1
            fi
          }

          check "$BASE_URL/"
          check "$BASE_URL/login"
          check "$BASE_URL/register"
          check "$BASE_URL/api/health"
