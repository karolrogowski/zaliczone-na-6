name: Weryfikacja wdrożenia

on:
  push:
    branches: [main]

jobs:
  sync-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deployment_id: ${{ steps.redeploy.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Utwórz .env.local z danymi Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: printf 'VERCEL_TOKEN=%s\nVERCEL_PROJECT_ID=%s\n' "$VERCEL_TOKEN" "$VERCEL_PROJECT_ID" > .env.local
      - name: Synchronizuj .env.vercel → Vercel
        run: node scripts/sync-env-vercel.mjs
      - name: Wyzwól redeploy Vercel z nową konfiguracją
        id: redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          LATEST_ID=$(curl -s \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['deployments'][0]['uid'])")
          echo "Redeployuję: $LATEST_ID"
          NEW_ID=$(curl -s -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments/$LATEST_ID/redeploy" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['uid'])")
          echo "Nowy deployment: $NEW_ID"
          echo "deployment_id=$NEW_ID" >> $GITHUB_OUTPUT

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Zastosuj migracje do Supabase Cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --yes
          npx supabase db push --yes

  verify:
    needs: [sync-env, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Czekaj na deployment Vercel
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ needs.sync-env.outputs.deployment_id }}
        run: |
          echo "Czekam na deployment: $DEPLOYMENT_ID"

          for i in $(seq 1 20); do
            RESULT=$(curl -s \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID")

            STATE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('readyState','UNKNOWN'))")
            URL=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))")

            echo "Próba $i/20 — stan: $STATE"

            if [ "$STATE" = "READY" ]; then
              echo "✅ Deployment gotowy: https://$URL"
              echo "url=https://$URL" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "❌ Deployment zakończony błędem: $STATE"
              exit 1
            fi

            sleep 30
          done

          echo "❌ Timeout — deployment nie zakończył się w ciągu 10 minut"
          exit 1

      - name: Smoke testy
        env:
          BASE_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          check() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" "$1")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $1 → $STATUS"
            else
              echo "❌ $1 → $STATUS"
              exit 1
            fi
          }

          check "$BASE_URL/"
          check "$BASE_URL/login"
          check "$BASE_URL/register"
