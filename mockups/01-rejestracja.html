        <button class=\"reveal\" id=\"reveal\" type=\"button\" aria-label=\"Pokaż hasło\">\n            <svg id=\"reveal-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"pwd-meter\" id=\"pwd-meter\">\n          <div class=\"pwd-seg\"><\u002Fdiv><div class=\"pwd-seg\"><\u002Fdiv><div class=\"pwd-seg\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"pwd-hint\" id=\"pwd-hint\">Min. 8 znaków, jedna cyfra<\u002Fp>\n      <\u002Fdiv>\n\n      <button class=\"cta\" id=\"cta\">\n        <span id=\"cta-label\">Załóż konto i szukaj korepetytora<\u002Fspan>\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fbutton>\n\n      <div class=\"divider\">albo<\u002Fdiv>\n\n      <button class=\"oauth\">\n        <svg viewBox=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z\"><\u002Fpath><path fill=\"#34A853\" d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z\"><\u002Fpath><path fill=\"#FBBC05\" d=\"M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88z\"><\u002Fpath><path fill=\"#EA4335\" d=\"M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15A10.5 10.5 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.4 12 5.4z\"><\u002Fpath><\u002Fsvg>\n        Kontynuuj z Google\n      <\u002Fbutton>\n\n      <p class=\"legal\">Tworząc konto akceptujesz <a href=\"#\">Regulamin<\u002Fa> i <a href=\"#\">Politykę prywatności<\u002Fa>.<\u002Fp>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n  const body = document.body;\n  const hlAccent = document.getElementById('hl-accent');\n  const subhead = document.getElementById('subhead');\n  const ctaLabel = document.getElementById('cta-label');\n\n  const COPY = {\n    student: {\n      hl: 'Znajdź pomoc dziś wieczorem.',\n      sub: 'Załóż konto w 30 sekund. Bez karty na start — dane płatności podasz dopiero przed pierwszą sesją.',\n      cta: 'Załóż konto i szukaj korepetytora',\n      headlineTop: 'Klasówka jutro?'\n    },\n    tutor: {\n      hl: 'Zacznij zarabiać w ten weekend.',\n      sub: 'Włączasz dostępność kiedy masz czas — zlecenia same do Ciebie trafiają. 72 zł za godzinną sesję, wypłata co tydzień.',\n      cta: 'Załóż konto korepetytora',\n      headlineTop: 'Masz wiedzę?'\n    }\n  };\n\n  function selectRole(role) {\n    body.dataset.role = role;\n    const c = COPY[role];\n    hlAccent.textContent = c.hl;\n    subhead.textContent = c.sub;\n    ctaLabel.textContent = c.cta;\n    document.querySelector('.headline').childNodes[0].textContent = c.headlineTop;\n  }\n\n  /* Password reveal */\n  const pwd = document.getElementById('password');\n  const reveal = document.getElementById('reveal');\n  const revealIcon = document.getElementById('reveal-icon');\n  reveal.addEventListener('click', () => {\n    const show = pwd.type === 'password';\n    pwd.type = show ? 'text' : 'password';\n    revealIcon.innerHTML = show\n      ? '<path d=\"M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"/><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"/>'\n      : '<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>';\n  });\n\n  /* Password strength */\n  const segs = document.querySelectorAll('#pwd-meter .pwd-seg');\n  const hint = document.getElementById('pwd-hint');\n  pwd.addEventListener('input', () => {\n    const v = pwd.value;\n    let score = 0;\n    if (v.length >= 8) score++;\n    if (/\\d/.test(v)) score++;\n    if (/[^A-Za-z0-9]/.test(v) || (/[A-Z]/.test(v) && v.length >= 10)) score++;\n    segs.forEach((s, i) => { s.className = 'pwd-seg' + (i < score ? ' on-' + score : ''); });\n    if (v.length === 0) { hint.classList.remove('ok'); hint.textContent = 'Min. 8 znaków, jedna cyfra'; }\n    else if (score >= 2) { hint.classList.add('ok'); hint.textContent = score === 3 ? 'Silne hasło' : 'Wystarczająco silne'; }\n    else { hint.classList.remove('ok'); hint.textContent = 'Za słabe — dodaj cyfrę lub znak specjalny'; }\n  });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
